spring.datasource.url=jdbc:h2:mem:tera;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt.secret=tera-test-secret-key-with-at-least-thirty-two-characters
jwt.access-token-expiration=900
jwt.refresh-token-expiration=604800

allowed.origins=http://localhost:3000
frontend.url=http://localhost:3000
app.cookie.secure=false
google.oauth.client-id=
google.oauth.client-secret=
google.oauth.redirect-uri=http://localhost:8080/api/auth/callback/google

app.mail.delivery-enabled=false
app.mail.from=no-reply@tera.test
email.verification.code-secret=tera-test-email-verification-secret
email.verification.ttl-seconds=600
email.verification.resend-cooldown-seconds=60
email.verification.max-attempts=5

debug=false
logging.level.root=INFO
