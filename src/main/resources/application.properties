spring.application.name=be-tera-learn
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=tera}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tera
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=tera
spring.flyway.default-schema=tera
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET:tera-development-secret-key-change-before-production-2026}
jwt.access-token-expiration=900
jwt.refresh-token-expiration=604800

allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}
frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cookie.secure=${APP_COOKIE_SECURE:false}

google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.delivery-enabled=${MAIL_DELIVERY_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@tera.vn}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

email.verification.code-secret=${EMAIL_VERIFICATION_SECRET:tera-email-verification-secret-change-before-production}
email.verification.ttl-seconds=600
email.verification.resend-cooldown-seconds=60
email.verification.max-attempts=5

payment.order.expiry-minutes=${PAYMENT_ORDER_EXPIRY_MINUTES:30}
payment.sepay.bank=${SEPAY_BANK:}
payment.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
payment.sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
payment.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
debug=false
logging.level.root=INFO
